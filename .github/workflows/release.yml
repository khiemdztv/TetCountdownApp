name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _build/package-lock.json
      - run: npm ci
      - run: npm ci --prefix _build
      - run: npm run setup:native
      - run: npm run release:native
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: TetCountdown2027-Windows-x64
          path: |
            dist/release/v*/TetCountdown2027-Windows-x64.zip
            dist/release/v*/resources.neu
            dist/release/v*/update-manifest.json
            dist/release/v*/SHA256SUMS.txt
      - name: Create draft release with verified assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = context.ref.replace('refs/tags/', '');
            if (tag !== 'v' + version) throw new Error('Tag must match package.json version');
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: 'TetCountdownApp ' + tag,
              draft: true, prerelease: false,
              body: "TetCountdownApp v1.0.1\n\n- Đổi tên ứng dụng thành TetCountdownApp.\n- Icon dê chibi mới cho cửa sổ, thanh tác vụ và file ứng dụng.\n- Thêm dòng Powered by khiemdztv dưới phiên bản ở góc trái.\n\nGiải nén toàn bộ ZIP, rồi mở TetCountdownApp.exe. Bản này kèm 3 album nhạc. Người đang dùng bản cũ có thể vào Cài đặt > Kiểm tra cập nhật. File resources.neu và update-manifest.json dành cho cập nhật trong app; để đổi cả tên file exe và icon trong Explorer, tải ZIP mới."
            });
            for (const name of ['TetCountdown2027-Windows-x64.zip', 'resources.neu', 'update-manifest.json', 'SHA256SUMS.txt']) {
              const file = path.join('dist', 'release', tag, name);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name,
                data: fs.readFileSync(file)
              });
            }
