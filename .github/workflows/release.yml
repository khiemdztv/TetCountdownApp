name: Build Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            _build/package-lock.json
      - run: npm ci
      - run: npm ci --prefix _build
      - run: npm run setup:native
      - run: npm run release:native
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: TetCountdown2027-Windows-x64
          path: |
            dist/release/v*/TetCountdown2027-Windows-x64.zip
            dist/release/v*/resources.neu
            dist/release/v*/update-manifest.json
            dist/release/v*/SHA256SUMS.txt
      - name: Create draft release with verified assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
            const tag = context.ref.replace('refs/tags/', '');
            if (tag !== 'v' + version) throw new Error('Tag must match package.json version');
            const release = await github.rest.repos.createRelease({
              ...context.repo, tag_name: tag, name: 'TetCountdownApp ' + tag,
              draft: true, prerelease: false,
              body: "- Sửa lỗi HTTP error: Failed to read connection khi kiểm tra cập nhật.\n- Thêm kết nối dự phòng để app tải bản mới từ GitHub trên Windows.\n- Sửa màn hình trắng/đen khi app tự mở lại sau cập nhật.\n- Giữ nguyên nhạc và cài đặt khi cập nhật.\n\nTải TetCountdown2027-Windows-x64.zip, giải nén toàn bộ rồi mở TetCountdownApp.exe. Nếu bản v1.0.0–v1.0.2 báo lỗi kết nối, hãy tải resources.neu trong bản phát hành này, thoát hẳn app và thay file resources.neu trong thư mục app. Sau lần sửa này có thể cập nhật trực tiếp trong Cài đặt."
            });
            for (const name of ['TetCountdown2027-Windows-x64.zip', 'resources.neu', 'update-manifest.json', 'SHA256SUMS.txt']) {
              const file = path.join('dist', 'release', tag, name);
              await github.rest.repos.uploadReleaseAsset({
                ...context.repo, release_id: release.data.id, name,
                data: fs.readFileSync(file)
              });
            }
